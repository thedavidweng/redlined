# Publishes the site to GitHub Pages on every push to main. Build: _tools/build.py (slim copy of the repo: pages, mocks, the live stage; no recorded clips).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Generated files are up to date
        run: python3 _tools/sync.py --check || { echo "::error::Run python3 _tools/sync.py and commit the result."; exit 1; }
      - name: Lint and test
        run: |
          pipx run ruff==0.17.0 check _tools
          npx -y oxlint@1.87.0
          node deliverect/mock/model.test.mjs
          node _tools/performance.test.mjs
      - name: Build
        run: python3 _tools/build.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
