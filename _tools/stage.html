<!doctype html>
<!-- Generic before/after stage: plays one redline's storyboard (<redline>/clip.js, run by _tools/play.js inside each mock) side by side, then loops.
     Works from file:// and from a static host: only relative paths, a script tag instead of fetch, postMessage instead of reaching into the iframes.
       stage.html?product=modo&redline=03-feat-drag-booking            loops (manual preview, the product previewer embeds this)
       stage.html?product=modo&redline=03-feat-drag-booking&once=1     one pass, then stage.finished = true (_tools/record.py)
       stage.html?product=modo&layout=single                           portrait pages: one window, Before then After in the same place, canvas sized to the mock
     Without ?redline= it waits for postMessage({ redlined: 'play', redline }) / ({ redlined: 'stop' }) from the embedding page.
     Only one mock is live at a time; the other panel shows a frozen still (single layout: the After panel is hidden until it takes over).
     Once the config is in, the stage posts { redlined: 'size', w, h } (its canvas, px) to the embedding page. Drawn here, over the mocks: finger, ripple, ring, receipt, credit, dimming. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redlined stage</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="brand.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #111; color: var(--ink);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header { position: absolute; left: 72px; right: 72px; top: 40px; height: 40px; display: flex; align-items: center; justify-content: space-between; z-index: 1; }
  .meta { display: flex; align-items: center; gap: 18px; font-size: 19px; font-weight: 500; letter-spacing: -.005em; color: var(--muted); white-space: pre; }
  .meta b { color: var(--ink-2); font-weight: 600; }
  .num { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 14px 7px 13px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line);
    font-size: 15px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .num b { font-size: 19px; letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
  .num:empty { display: none; }
  .panels { position: absolute; left: 72px; right: 72px; top: 112px; bottom: 52px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; z-index: 1;
    transition: opacity .45s ease; }
  body.curtain .panels { opacity: 0; }
  .panel { position: relative; display: flex; flex-direction: column; transition: filter .5s var(--ease); }
  .panel.dim { filter: brightness(.42) saturate(.3); }
  .label { display: flex; align-items: center; gap: 14px; height: 36px; margin-bottom: 16px; }
  .tag { font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .after .tag { color: var(--ink); }
  .window { position: relative; flex: 1; border-radius: 18px; overflow: hidden; background: white;
    box-shadow: 0 0 0 1px #ffffff1f, 0 30px 80px -24px #000000e6, 0 0 0 9px #ffffff08; }
  /* Portrait phone products (REDLINED.device, from stage.json): two phones at device size, scaled down only if they don't fit, centred. */
  body.device .panels { grid-template-columns: repeat(2, max-content); justify-content: center; column-gap: 220px; }
  body.device .window { flex: none; width: var(--win-w); height: var(--win-h); border-radius: var(--win-r); }
  .window iframe { position: absolute; top: 0; left: 0; width: 1000px; height: 1000px; border: 0; transform-origin: 0 0; pointer-events: none; }
  /* Highlight ring drawn in the stage, over the iframe and under the finger. Same language as Deliverect's cap-hl/bad/good: outline tightens 8px to 3px and fades in. */
  .ring { position: absolute; z-index: 2; pointer-events: none; border-radius: 12px; outline: 2px solid transparent; outline-offset: 8px; opacity: 0;
    transition: opacity .25s ease, outline-color .25s ease, outline-offset .35s var(--ease); }
  .ring.on { opacity: 1; outline-offset: 3px; }
  .ring.hl { outline-color: #f5a524; } .ring.bad { outline-color: #d4442e; } .ring.good { outline-color: #00a862; }
  @media (prefers-reduced-motion: reduce) { .ring { transition: none; } }
  .receipt { position: absolute; right: 26px; bottom: 26px; width: 238px; padding: 18px 18px 26px; background: #fdfdfb; color: #111;
    font: 500 14px/1.45 ui-monospace, "SF Mono", Menlo, monospace; text-align: center; transform: translateY(140%) rotate(3deg);
    transition: transform .7s var(--ease); filter: drop-shadow(0 14px 24px #0003);
    -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/14px 51% repeat-x, linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat; }
  .receipt.on { transform: translateY(0) rotate(-2deg); }
  .receipt:empty { visibility: hidden; }  /* an empty receipt is only 44px tall, so translateY(140%) leaves its top edge peeking in at the window bottom */
  .receipt .cap { font-size: 11px; letter-spacing: .14em; color: #888; margin-bottom: 10px; }
  .receipt .big { font-size: 26px; font-weight: 700; letter-spacing: .08em; margin: 4px 0 2px; }
  .receipt svg { width: 58px; height: 58px; display: block; margin: 6px auto 4px; }
  .receipt hr { border: 0; border-top: 1px dashed #bbb; margin: 10px 0; }
  .finger { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none; z-index: 10;
    background: #14141478; box-shadow: inset 0 0 0 2px #ffffffd9, 0 0 0 1px #00000024, 0 8px 20px #00000026; backdrop-filter: blur(1px);
    opacity: 0; transition: opacity .3s ease, scale .14s ease-out; }
  .finger.on { opacity: 1; } .finger.down { scale: .84; background: #141414a8; }
  .ripple { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 2px solid #1414148c;
    pointer-events: none; z-index: 9; animation: ripple .55s var(--ease) forwards; }
  .credit { position: absolute; right: 72px; bottom: 18px; font-size: 13px; color: var(--muted); opacity: .7; z-index: 1; }
  .credit a { color: inherit; text-decoration: none; }
  /* Single layout (portrait pages): no header (the page has one), one window at the mock's own size, the two panels stacked in it, crossfading.
     The label row names both sides and lights the one showing. */
  .switch { display: none; }
  body.single { position: relative; width: var(--stage-w); height: var(--stage-h); }
  body.single header, body.single .panel .label { display: none; }
  body.single .panels { left: 0; right: 0; top: 88px; bottom: 48px; display: grid; grid-template-columns: max-content; justify-content: center; }
  body.single .panel { grid-area: 1 / 1; transition: opacity .45s ease; }
  body.single[data-show="before"] .after, body.single[data-show="after"] .before { opacity: 0; }
  body.single .window { flex: none; width: var(--win-w); height: var(--win-h); }
  body.single.device .window { border-radius: var(--win-r); }
  body.single .switch { position: absolute; left: 0; right: 0; top: 28px; height: 40px; display: flex; justify-content: center; align-items: center; gap: 28px; z-index: 1;
    font-size: 22px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); transition: opacity .45s ease; }
  body.single .switch span { transition: color .45s ease; }
  body.single[data-show="before"] .switch .b, body.single[data-show="after"] .switch .a { color: var(--ink); }
  body.single.curtain .switch { opacity: 0; }
  body.single .credit { left: 24px; right: 24px; bottom: 14px; text-align: center; }
  @keyframes ripple { from { opacity: .9; scale: .7; } to { opacity: 0; scale: 1.9; } }
</style>
<script src="../_ios/devices.js"></script>
</head>
<body class="curtain">
  <header>
    <div class="brand"><span class="brand-mark"></span><span class="brand-word">Redlined</span></div>
    <div class="meta"><span id="product"></span><span class="num" id="number"></span></div>
  </header>
  <div class="switch" aria-hidden="true"><span class="b">Before</span><span>→</span><span class="a">After</span></div>
  <div class="panels">
    <section class="panel before" id="before">
      <div class="label"><span class="tag">Before</span></div>
      <div class="window"><div class="ring"></div><div class="receipt"></div></div>
    </section>
    <section class="panel after" id="after">
      <div class="label"><span class="tag">After</span></div>
      <div class="window"><div class="ring"></div><div class="receipt"></div></div>
    </section>
  </div>
  <div class="credit" id="credit"></div>
  <div class="finger" id="finger"></div>
<script>
  const params = new URLSearchParams(location.search);
  const product = /^[a-z0-9-]+$/.test(params.get('product') ?? '') ? params.get('product') : null;
  const once = params.get('once') === '1';
  const single = params.get('layout') === 'single';
  let W = 1920, H = 1080;  // the canvas; single layout sizes it to the mock
  const $ = selector => document.querySelector(selector);
  let config = null, redlines = [], redline = null, gen = 0, waiters = new Set(), finger = { x: W / 2, y: H + 100 };
  const STALE = new Error('stopped');  // thrown into whatever a stop() interrupts

  // Config comes from <product>/_shared/redlines.js (generated by sync.py), loaded by script tag so it also works from file://.
  const ready = product && new Promise((resolve, reject) => document.head.append(Object.assign(document.createElement('script'), { src: `../${product}/_shared/redlines.js`, onload: resolve, onerror: reject }))).then(() => {
    config = REDLINED;
    redlines = config.redlines;
    const device = typeof config.device === 'string' ? IosDevices[config.device] : null;  // a name from _ios/devices.js, the one place sizes are written
    if (config.device && !device) throw new Error(`stage.json: unknown device "${config.device}"`);
    config.device = device;
    if (device) document.body.classList.add('device');
    if (single) {
      // The window at the mock's own size: the phone at 1:1, or a desktop mock 1000 wide and about as tall as a wide-layout panel shows it.
      const win = device ? { w: device.width, h: device.height, r: device.radius } : { w: 1000, h: 1000, r: 18 };
      [W, H] = [Math.max(win.w + 80, 600), win.h + 136];  // 88 above (label row), 48 below (credit)
      document.body.classList.add('single');
      document.body.dataset.show = 'before';
      for (const [name, value] of [['w', win.w], ['h', win.h], ['r', win.r]]) document.body.style.setProperty(`--win-${name}`, `${value}px`);
      for (const [name, value] of [['w', W], ['h', H]]) document.body.style.setProperty(`--stage-${name}`, `${value}px`);
    } else if (device) {
      const s = Math.min(1, 864 / device.height);  // 864 = panel height below the 52px label
      for (const [name, value] of [['w', device.width], ['h', device.height], ['r', device.radius]]) document.body.style.setProperty(`--win-${name}`, `${value * s}px`);
    }
    finger = { x: W / 2, y: H + 100 };
    if (parent !== window) parent.postMessage({ redlined: 'size', w: W, h: H }, '*');
    // "Deliverect Pickup Manager": the product in full weight, the surface after it. No separator glyph.
    const [name, ...rest] = (config.label ?? config.name).split(' · ');
    $('#product').innerHTML = `<b>${name}</b>${rest.map(part => ` ${part}`).join('')}`;
  });

  const now = () => Date.now() / 1000;
  const sleep = s => { const g = gen; return new Promise((resolve, reject) => setTimeout(() => g === gen ? resolve() : reject(STALE), s * 1000)); };
  const waitFor = (frame, type) => new Promise((resolve, reject) => waiters.add({ frame, type, resolve, reject }));
  const frames = () => [...document.querySelectorAll('.window iframe')];
  let displayScale = 1;
  const scaleOf = frame => frame.getBoundingClientRect().width / frame.offsetWidth;
  const sendScale = frame => send(frame, { redlined: 'scale', scale: displayScale * scaleOf(frame) });
  const toStage = (frame, x, y) => { const r = frame.getBoundingClientRect(), k = r.width / frame.offsetWidth; return [r.left + x * k, r.top + y * k]; };
  const toMock = (frame, x, y) => { const r = frame.getBoundingClientRect(), k = r.width / frame.offsetWidth; return [(x - r.left) / k, (y - r.top) / k]; };

  // A mock in a panel. mode 'still': loads, freezes itself and reports 'frozen'. 'live': reports 'ready', then plays on 'run'.
  // `under` stacks the new frame below a frozen one in the same window, so the swap never flashes.
  function mount(side, mode, under) {
    const win = $(`#${side} .window`), frame = document.createElement('iframe'), box = win.getBoundingClientRect();
    const scale = config.device ? box.width / config.device.width : box.width / 1000;
    frame.style.transform = `scale(${scale})`;
    if (config.device) frame.style.width = `${config.device.width}px`;
    frame.style.height = `${box.height / scale}px`;
    const url = new URL(`../${config.mock}`, location.href);
    for (const [key, value] of [['redline', redline], ['side', side], ['play', mode], ...new URLSearchParams(extra)]) url.searchParams.set(key, value);
    frame.src = url;
    under ? under.before(frame) : win.prepend(frame);
    return frame;
  }
  let extra = '';  // the storyboard's `query`: extra mock URL params (e.g. state=booked), read from clip.js by script tag

  function send(frame, message) { frame.contentWindow.postMessage(message, '*'); }

  function reset() {
    for (const frame of frames()) frame.remove();  // a removed iframe takes its timers and WebGL contexts with it
    for (const side of ['before', 'after']) { stage.receipt(side, null); stage.ring(side, null); }
    stage.focus(null);
    if (single) document.body.dataset.show = 'before';
    stage.finger(W / 2, H + 100, false);
  }

  async function pass() {
    reset();
    stage.marks = [];
    // Single layout: the After panel is hidden until it takes over, so it needs no still.
    const after = single ? null : mount('after', 'still');
    if (after) await waitFor(after, 'frozen');
    const before = mount('before', 'live');
    await waitFor(before, 'ready');
    // Intro: focus and reveal together; start as soon as the .45s curtain transition ends.
    stage.marks.push({ kind: 'start', t: now() });
    stage.focus('before');
    stage.curtain(false);
    await sleep(0.45);
    let done = waitFor(before, 'done');
    send(before, { redlined: 'run', from: toMock(before, finger.x, finger.y), exit: null });
    await done;
    // Hand over: Before freezes where it ended, a fresh After starts under the frozen one. The recorder cuts that wait.
    const frozen = waitFor(before, 'frozen');
    send(before, { redlined: 'freeze' });
    if (!single) stage.focus('after');
    const t0 = now();
    const fresh = mount('after', 'live', after);
    await Promise.all([frozen, waitFor(fresh, 'ready')]);
    after?.remove();
    stage.marks.push({ kind: 'cut', t0, t1: now() });
    if (single) { stage.focus('after'); await sleep(0.7); }  // crossfade in place, then After starts
    done = waitFor(fresh, 'done');
    send(fresh, { redlined: 'run', from: toMock(fresh, finger.x, finger.y), exit: toMock(fresh, finger.x, H + 100) });
    await done;
    // Outro: the finger has left (play.js), hold the end, close the curtain.
    stage.focus(null);
    await sleep(1.6);
    stage.curtain(true);
    await sleep(0.6);
  }

  async function loop(name) {
    const g = gen;
    try {
      await ready;
      if (g !== gen) return;
      redline = name;
      // Posting number only; the folder name and explanations belong in the caption.
      const n = redlines.find(r => r.folder === name)?.n;
      $('#number').innerHTML = n ? `No.<b>${String(n).padStart(2, '0')}</b>` : '';
      // The storyboard may ask for extra mock params (query); the stage reads them from clip.js itself, a script tag works across origins.
      extra = await new Promise(resolve => {
        document.head.append(Object.assign(document.createElement('script'), { src: `../${product}/${name}/clip.js`, onload: () => resolve(globalThis.redlineClip?.query ?? ''), onerror: () => resolve('') }));
      });
      globalThis.redlineClip = undefined;
      if (g !== gen) return;
      do { await pass(); } while (!once);
      stage.finished = true;
    } catch (error) {
      if (error === STALE) return;
      console.error(error);
      stage.error = String(error);
    }
  }

  window.stage = {
    finished: false,
    marks: [],  // {kind:'start', t} when the curtain lifts, {kind:'cut', t0, t1} for waits the recorder should drop (seconds, Date.now()/1000)
    // Destroys both mocks at once and ignores anything they still say.
    stop() {
      gen++;
      for (const w of waiters) w.reject(STALE);
      waiters.clear();
      reset();
      stage.curtain(true);
      stage.finished = false;
    },
    // Switching redline from a running pass: fade the panels out first, then restart.
    async play(name) {
      const running = frames().length > 0 && !document.body.classList.contains('curtain');
      const g = ++gen;
      for (const w of waiters) w.reject(STALE);
      waiters.clear();
      stage.finished = false;
      for (const frame of frames()) frame.dataset.stale = '';  // no more messages from these
      if (running) { stage.curtain(true); await new Promise(resolve => setTimeout(resolve, 500)); }
      if (g === gen) loop(name);
    },
    // Wide: dims the side not playing. Single: shows the side (null keeps the current one).
    focus(side) {
      if (single) { if (side) document.body.dataset.show = side; return; }
      for (const s of ['before', 'after']) $(`#${s}`).classList.toggle('dim', side && s !== side);
    },
    receipt(side, html) {
      const el = $(`#${side} .receipt`);
      if (html) el.innerHTML = html;
      el.classList.toggle('on', Boolean(html));
    },
    // Outline around an element of the mock, drawn here, over the iframe and under the finger. rect is in the window's own px (the iframe's offset
    // and scale already applied), or null to remove it. tone: 'hl' | 'bad' | 'good'. Same language as Deliverect's cap-hl/bad/good: the outline tightens 8px to 3px and fades in.
    ring(side, rect, tone) {
      const el = $(`#${side} .ring`), pad = 4;  // breathing room between the element and the outline's resting position
      if (!rect) { el.classList.remove('on'); return; }
      el.classList.remove('hl', 'bad', 'good');
      el.classList.add(tone);
      Object.assign(el.style, { left: `${rect.left - pad}px`, top: `${rect.top - pad}px`, width: `${rect.width + 2 * pad}px`, height: `${rect.height + 2 * pad}px` });
      if (!el.classList.contains('on')) { void el.offsetWidth; el.classList.add('on'); }  // commit the 8px start so the tighten-in animates
    },
    finger(x, y, on = true) {
      const f = $('#finger');
      finger = { x, y };
      f.style.translate = `${x}px ${y}px`;
      f.classList.toggle('on', on);
    },
    press(down) {
      const f = $('#finger');
      f.classList.toggle('down', down);
      if (down) {
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.translate = f.style.translate;
        document.body.append(r);
        setTimeout(() => r.remove(), 600);
      }
    },
    // Data credits a mock must show but the real app doesn't (map tiles): IosDevice.credit() posts them here.
    credit(html) { $('#credit').innerHTML = html; },
    // Fades only the panels, so the brand and backdrop hold still across the loop seam.
    curtain(on) { document.body.classList.toggle('curtain', on); },
  };

  // Everything the mocks say arrives here; the sender's frame tells which side it is.
  addEventListener('message', ({ source, data }) => {
    if (!data?.redlined) return;
    if (source === parent && parent !== window) {
      if (data.redlined === 'play') stage.play(data.redline);
      if (data.redlined === 'stop') stage.stop();
      if (data.redlined === 'scale' && Number.isFinite(data.scale) && data.scale > 0) {
        displayScale = data.scale;
        frames().forEach(sendScale);
      }
      return;
    }
    const frame = frames().find(f => f.contentWindow === source);
    if (!frame || 'stale' in frame.dataset) return;
    const side = frame.closest('.panel').id;
    for (const w of [...waiters]) if (w.frame === frame && w.type === data.redlined) { waiters.delete(w); w.resolve(); }
    if (data.redlined === 'finger') stage.finger(...toStage(frame, data.x, data.y), data.on);
    if (data.redlined === 'press') stage.press(data.down);
    if (data.redlined === 'scale-request') sendScale(frame);
    if (data.redlined === 'ring') {
      const k = data.rect ? scaleOf(frame) : 1;
      stage.ring(side, data.rect && Object.fromEntries(Object.entries(data.rect).map(([key, value]) => [key, value * k])), data.tone);
    }
    if (data.redlined === 'receipt') stage.receipt(side, data.html);
    if (data.redlined === 'credit') stage.credit(data.html);
  });

  // Manual preview and the recorder: ?redline= starts straight away.
  if (params.get('redline')) stage.play(params.get('redline'));
</script>
</body>
</html>
