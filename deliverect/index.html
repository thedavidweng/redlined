<!doctype html>
<!-- Previewer: plays each redline's clip, with replay and a link to the live, interactive mock.
     Works from file:// (double-click) and from _tools/serve.py. List: _shared/redlines.js (generated by _tools/sync.py). Deep link: #<folder> -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redlined · Deliverect</title>
<style>
  :root { --bg: #efede8; --ink: #14130f; --muted: #6f6b62; --chip: #dedad2; --good: #007a47; --ease: cubic-bezier(.32,.72,0,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px; padding: 20px 28px 16px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  header > div { min-width: 0; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); }
  h1 { font-size: 22px; letter-spacing: -.015em; font-weight: 650; margin: 4px 0 0; }
  header p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border: 0; border-radius: 9px; font: 550 13px/1 inherit; font-family: inherit;
    text-decoration: none; cursor: pointer; background: var(--chip); color: var(--ink); transition: background-color .2s ease, transform .12s ease-out; white-space: nowrap; }
  .btn:hover { background: #d3cfc6; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--ink); color: white; }
  .btn.primary:hover { background: #2c2a24; }
  .btn svg { width: 15px; height: 15px; }
  .btn.quiet { background: none; color: var(--muted); padding: 0 6px; }
  .btn.quiet:hover { color: var(--ink); background: none; }
  .player { position: relative; min-height: 0; display: grid; place-items: center; }
  .screen { position: relative; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; height: 100%; border-radius: 14px; overflow: hidden; background: var(--bg);
    box-shadow: 0 1px 0 #0000000a, 0 12px 36px -16px #3a2f1a40, 0 0 0 1px #00000010; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; }
  .replay { position: absolute; inset: 0; display: grid; place-items: center; background: #efede8b3; border: 0; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity .35s var(--ease); font-family: inherit; }
  .replay.on { opacity: 1; pointer-events: auto; }
  .replay span { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; background: var(--ink); color: white; font-size: 16px; font-weight: 600;
    transform: scale(.94); transition: transform .45s var(--ease); box-shadow: 0 10px 30px -10px #0006; }
  .replay.on span { transform: none; }
  .replay svg { width: 18px; height: 18px; }
  .empty { color: var(--muted); font-size: 15px; text-align: center; line-height: 1.6; padding: 24px; }
  .empty code { background: var(--chip); padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  nav { justify-self: center; display: flex; align-items: center; gap: 8px; max-width: 100%; min-width: 0; }
  .seg { display: flex; padding: 3px; border-radius: 10px; background: var(--chip); min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button, .arrow { font: 500 13px inherit; font-family: inherit; border: 0; background: none; color: var(--ink); cursor: pointer; border-radius: 7px; padding: 6px 12px; white-space: nowrap; flex-shrink: 0; }
  .seg button[aria-pressed="true"] { background: white; box-shadow: 0 1px 2px #0002; font-weight: 600; }
  .seg button:hover:not([aria-pressed="true"]) { background: #ffffff60; }
  .arrow { width: 32px; height: 32px; padding: 0; background: var(--chip); font-size: 15px; }
  .arrow:hover { background: #d3cfc6; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--good); outline-offset: 2px; }
  @media (max-width: 760px) {
    body { padding: 16px; }
    header { flex-direction: column; align-items: stretch; }
    .actions { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Redlined</div>
      <h1 id="title"></h1>
      <p id="problem"></p>
    </div>
    <div class="actions">
      <button class="btn" id="replay-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Replay
      </button>
      <a class="btn quiet" id="original" target="_blank" rel="noopener">Original</a>
      <a class="btn primary" id="live" target="_blank" rel="noopener">
        Try it live
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </a>
    </div>
  </header>
  <div class="player">
    <div class="screen" id="screen">
      <video id="video" muted playsinline preload="auto"></video>
      <button class="replay" id="replay" type="button" aria-label="Replay">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Replay</span>
      </button>
      <div class="empty" id="empty" hidden></div>
    </div>
  </div>
  <nav aria-label="Redlines">
    <button class="arrow" id="prev" aria-label="Previous redline">←</button>
    <div class="seg" id="seg"></div>
    <button class="arrow" id="next" aria-label="Next redline">→</button>
  </nav>
<script src="_shared/redlines.js"></script>
<script>
  // Classic script so the page also works from file://.
  const { product, label, redlines } = REDLINED;
  const $ = selector => document.querySelector(selector);
  const video = $('#video'), overlay = $('#replay'), empty = $('#empty');
  $('#eyebrow').textContent = `Redlined · ${label}`;

  const seg = $('#seg');
  for (const { folder, n } of redlines) {
    const b = document.createElement('button');
    b.textContent = `${n}: ${folder}`;
    b.dataset.folder = folder;
    b.addEventListener('click', () => go(folder));
    seg.append(b);
  }

  // The clip plays once, then rests on its final state (just before the closing fade) with a replay button over it.
  const REST = 2.0; // seconds before the end: the finger has left, the closing fade (last ~1.5 s) has not begun
  function play() {
    overlay.classList.remove('on');
    video.currentTime = 0;
    video.play().catch(() => overlay.classList.add('on')); // autoplay blocked → offer the button
  }
  video.addEventListener('ended', () => {
    video.currentTime = Math.max(0, video.duration - REST);
    overlay.classList.add('on');
  });
  overlay.addEventListener('click', play);
  $('#replay-btn').addEventListener('click', play);

  let current;
  function go(folder) {
    const entry = redlines.find(r => r.folder === folder) ?? redlines[0];
    current = entry.folder;
    if (location.hash !== `#${entry.folder}`) history.replaceState(null, '', `#${entry.folder}`);
    document.title = `${entry.n}: ${entry.title} · Redlined · ${REDLINED.name}`;
    $('#title').textContent = `${entry.n}: ${entry.title}`;
    $('#problem').textContent = entry.problem;
    $('#live').href = `mock/index.html?redline=${entry.folder}`;
    $('#original').href = `mock/index.html?redline=${entry.folder}&side=before`;
    for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.folder === entry.folder));
    seg.querySelector('[aria-pressed="true"]').scrollIntoView({ block: 'nearest', inline: 'center' });
    video.hidden = !entry.clip;
    $('#replay-btn').disabled = !entry.clip;
    empty.hidden = entry.clip;
    overlay.classList.remove('on');
    if (entry.clip) {
      video.src = `${entry.folder}/media/clip.mp4`;
      play();
    } else {
      video.removeAttribute('src');
      empty.innerHTML = `No clip yet. Record it with<br><code>uv run --with playwright python _tools/record.py ${product}/${entry.folder}</code><br>or try the change live.`;
    }
  }
  const step = n => go(redlines[(redlines.findIndex(r => r.folder === current) + n + redlines.length) % redlines.length].folder);
  $('#prev').addEventListener('click', () => step(-1));
  $('#next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft') step(-1);
    if (event.key === 'ArrowRight') step(1);
    if (event.key === 'r' && !event.metaKey && !event.ctrlKey) play();
  });
  addEventListener('hashchange', () => location.hash.slice(1) !== current && go(location.hash.slice(1)));
  go(location.hash.slice(1));
</script>
</body>
</html>
