<!doctype html>
<!-- Previewer: runs each redline live in the stage, with replay and a link to the live, interactive mock.
     Works from file:// (double-click) and from _tools/serve.py. List: _shared/redlines.js (generated by _tools/sync.py). Deep link: #<folder> -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Redlined · Evo</title>
<link rel="icon" type="image/svg+xml" href="../_tools/logo.svg">
<link rel="stylesheet" href="../_tools/brand.css">
<link rel="stylesheet" href="../_tools/previewer.css">
</head>
<body>
  <div class="brand-bg"></div>
  <div class="top">
    <a class="brand home" href="../index.html" aria-label="Redlined home"><span class="brand-mark"></span><span class="brand-word">Redlined</span></a>
    <div class="product" id="product"></div>
  </div>
  <header>
    <div>
      <h1><span class="n" id="n"></span><span id="title"></span></h1>
      <p id="caption"></p>
    </div>
    <div class="actions">
      <button class="btn" id="replay-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Replay
      </button>
      <a class="btn quiet" id="original" target="_blank" rel="noopener">Original</a>
      <a class="btn primary" id="live" target="_blank" rel="noopener">
        Try it live
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </a>
    </div>
  </header>
  <div class="player">
    <div class="screen" id="screen">
      <iframe id="stage" title="Redline preview" allow="autoplay"></iframe>
      <div class="empty brand-placeholder with-text" id="empty" hidden></div>
    </div>
  </div>
  <nav aria-label="Redlines">
    <button class="arrow" id="prev" aria-label="Previous redline">←</button>
    <div class="seg" id="seg"></div>
    <button class="arrow" id="next" aria-label="Next redline">→</button>
  </nav>
<script src="_shared/redlines.js"></script>
<script src="../_tools/previewer.js"></script>
</body>
</html>
